<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotter</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>SPOTTER</strong>
        <span class="tag">voice strength coach</span>
        <span id="status" class="pill">offline</span>
        <span id="mode" class="pill subtle"></span>
      </div>
      <button id="start">Start workout</button>
    </header>

    <main>
      <section class="left">
        <div class="card next">
          <div class="label">Next set</div>
          <div id="next-weight" class="big">—</div>
          <div id="next-detail" class="detail">Tell Spotter what you're lifting.</div>
          <div id="next-insight" class="insight"></div>
        </div>
        <div class="card rest" id="rest-card" hidden>
          <div class="label">Rest</div>
          <div id="rest-time" class="big mono">2:00</div>
        </div>
        <div class="card plot-card">
          <div class="label">Analysis <span id="sandbox-badge" class="badge" hidden>ran in Daytona</span></div>
          <div id="plot" class="plot"><p class="empty">Ask "what's next?" to see your trend.</p></div>
        </div>
        <div class="card summary" id="summary" hidden></div>
      </section>

      <aside>
        <div class="card">
          <div class="label">Today</div>
          <table class="sets">
            <thead><tr><th>#</th><th>Lift</th><th>lb</th><th>Reps</th><th>RPE</th></tr></thead>
            <tbody id="sets"><tr><td colspan="5" class="empty">No sets yet.</td></tr></tbody>
          </table>
        </div>
        <div class="card">
          <div class="label">Agent activity</div>
          <ol id="activity" class="activity"></ol>
        </div>
        <div class="card grow">
          <div class="label">Transcript</div>
          <div id="transcript" class="transcript"></div>
        </div>
      </aside>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
