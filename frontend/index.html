<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talk to Your Experiment</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <div class="brand">
        <strong>Talk to your experiment</strong>
        <span id="status" class="pill">offline</span>
        <span id="mode" class="pill subtle"></span>
      </div>
      <div class="actions">
        <div class="modes" role="radiogroup" aria-label="Call mode">
          <button data-mode="todo" class="mode" title="Work through your open questions together">To-do list</button>
          <button data-mode="walkthrough" class="mode" title="Sam presents the experiment; you ask questions like an advisor">Walkthrough</button>
        </div>
        <button id="record" class="secondary" title="Record this tab (board + voices) as an explainer video">● Record explainer</button>
        <button id="start">Start call</button>
      </div>
    </header>

    <main>
      <section class="board">
        <div class="board-head">
          <span>Whiteboard</span>
          <span id="caption" class="caption"></span>
          <span id="step" class="pill subtle"></span>
        </div>
        <div id="surface" class="surface">
          <ol id="agenda" class="agenda" hidden></ol>
          <div id="diagram" class="diagram"><p class="empty hand">Sam draws here while explaining…</p></div>
          <div id="notes" class="notes"></div>
          <div id="pen" class="pen" aria-hidden="true">✎</div>
        </div>
      </section>

      <aside>
        <section class="panel">
          <h2>To-do <span id="todo-count" class="count"></span><button id="todo-reset" class="link" title="Restore the original TODO.md">reset</button></h2>
          <ul id="todos" class="todos"><li class="empty">Loading…</li></ul>
        </section>
        <section class="panel">
          <h2>Figures from the sandbox</h2>
          <div id="plots" class="plots"><p class="empty">No figures yet.</p></div>
        </section>
        <section class="panel">
          <h2>Agent activity</h2>
          <ol id="activity" class="activity"></ol>
        </section>
        <section class="panel grow">
          <h2>Transcript</h2>
          <div id="transcript" class="transcript"></div>
        </section>
      </aside>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
